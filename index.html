체계적으로 작성되고 있으나, 일부 항목에서는 교육성과 및 학습효과에 대한 분석을 보다 구체적으로 보완할 필요가 있음* 성찰 및 환류 항목 간 내용이 유사하게 작성되는 사례가 있어, 항목별 역할과 구분을 보다 명확히 할 필요가 있음* AI 및 에듀테크 기반 교수법 활용이 확대됨에 따라 교수자의 디지털 활용 역량을 지속적으로 강화할 필요가 있음* 강의실 네트워크 및 기자재 환경 등 디지털 수업 운영 여건에 대해 점진적인 개선의 필요성이 제기되어 관련 부서에 내용을 전달함.","improvement":"* 교수자 간 교수법 적용 역량 차이를 완화하기 위해 교수설계 교육과 맞춤형 컨설팅을 확대하여 수업 설계 및 운영 역량을 지속적으로 강화할 계획임* 플립드러닝 및 학습자 중심 교수법의 효과적 운영을 위해 교수설계 단계에서의 지원을 강화하고, 사례 중심의 교육을 통해 교수법 적용의 내실화를 도모할 예정임* AI 및 에듀테크 기반 교수법 활용 확대에 대응하여 관련 연수 및 교육 프로그램을 운영함으로써 교수자의 디지털 교수역량을 지속적으로 향상시킬 계획임* 교수설계 컨설팅 및 연수 프로그램 참여를 활성화하기 위해 다양한 참여 유인 방안을 마련하고, 프로그램 운영 방식을 개선하여 교수자의 참여도를 제고할 예정임* 동일 교과목 반복 참여에 대해서는 단계별 성과관리 체계를 도입하여 지속적인 수업 개선과 질적 고도화를 유도할 예정임* 사업 운영 성과를 체계적으로 분석하기 위해 데이터 기반 관리 및 연구 체계를 구축하고, 이를 통해 교수법 효과성 검증 및 정책 개선에 활용할 계획임"},{"projectName":"교수학습공동체(교SU-tudy)(교수학습개발팀)","weakness":"","improvement":""},{"projectName":"(혁신3)기초소양교육 지원 프로그램 운영(교수학습개발팀)","weakness":"참여 과목이 기초 교양 교과목에 편중되어 있어 전공 학문으로의 글쓰기 확장 및 연계가 미흡\n온라인 글쓰기 클리닉 시스템에 대한 학생들의 접근성이 낮고, 첨삭 기간이 일괄적으로 부여되어 교과목별 수업 진도 및 과제 제출 시점과의 정합성 결여","improvement":"기존 교양 중심에서 벗어나 ‘교양 기초→심화 교양/전공기초→전공’으로 이어지는 단계별 첨삭 체계를 설계하여 전공 수학 능력을 실질적으로 지원\n과목별 특성에 맞춰 첨삭 기간과 횟수를 조정할 수 있는 탄력적 운영제를 도입하고 온라인 시스템 노출을 높이고 e-Class를 활용하는 등 학생들의 접근성 및 관리 효율성을 강화"},{"projectName":"(혁신3)학습역량진단검사 프로그램(교수학습개발팀)","weakness":"- 외부 전문기관을 통해 검사를 운영하고 결과를 제공받는 구조로 인해, 운영 방식 자체를 개선하는 데 한계가 있음. - 홍보 이벤트 중심의 참여 유도 방식은 실제 검사 참여율을 크게 높이는 데 제한이 있으며, 일부 학생은 이벤트 참여 목적에 그쳐 검사 결과 활용도가 낮아질 가능성이 있음. - 검사 목적과 활용 방안에 대한 사전 안내가 충분하지 않아, 학생들이 검사 결과를 실제 학습 개선에 활용하는 데 어려움이 있음.","improvement":"- 검사 결과를 단순 제공에 그치지 않고, 학습컨설팅과 학습법 특강 등 다양한 학습지원 프로그램과 연계하여 학생들이 자신의 진단 결과를 실제 학습 개선에 활용할 수 있도록 함. - 반복 운영을 통해 누적된 검사 데이터를 분석하여 우리 대학 학생들의 학습 특성과 공통적인 취약 영역을 파악하고, 향후 학습지원 프로그램 기획의 기초자료로 활용함. - 외부 검사에 대한 의존도를 줄이고, 우리 대학 학생 특성과 교육 환경을 반영한 자체 학습역량 진단 시스템 구축을 통해 지속적이고 체계적인 진단·환류 구조를 마련함."},{"projectName":"(혁신3)학습관리 SU-SPP 프로그램(교수학습개발팀)","weakness":"- 온라인 위주의 일반 홍보로 인해 학생들의 실질적인 참여 유인이 부족\n- 에세이나 영상 등 공모전 특성에 맞게 특정 분야에 대한 공신력 있는 심사 전문성 확보 필요\n- 토론대회 등 특정 역량이 필요한 프로그램의 경우, 기초 지식 부족으로 인해 결과물의 질적 편차 발생\n- SUtory: 수토리 사이트 노후화, 인지도 부족","improvement":"- 학과사무실에 홍보를 요청하거나 유동 인구가 많은 교내 거점에 실물 포스터를 집중적으로 게시- 공모전 관련 교과목이나 전공 세미나 등과 연계하여 수업 과제나 활동이 자연스럽게 공모전 참여로 이어지도록 추진- 글쓰기, 영상 제작 등 각 분야의 전문 심사위원을 섭외하여 공정성을 높이고 학생들에게 수준 높은 피드백 제공- 공모전 및 경진대회 참여 전 사전 교육 프로그램을 운영하여 기본 역량을 상향 평준화하고 참여율 제고- SUtory: 전체적인 사이트 디자인 변경, 포트폴리오를 채울 수 있는 주제의 다양한 공모전과 간단히 참여 가능한 이벤트 다수 진행하여 접근성, 인지도 향상"},{"projectName":"(혁신3)적응능력향상 프로그램 운영(교수학습개발팀)","weakness":"1. 삼육메이트 프로그램 취약요소\n     ◦ 메이트(멘티)의 적응능력향상을 위한 프로그램이나, 목적과 상이하게 지원금 및 장학금에만 초점을 맞춘 학생들이 다수 발생하여 프로그램 질 관리에 대한 필요성이 대두되었음\n     ◦ 전년도 해당 프로그램 운영 시 수료율 향상을 위해 팀 내 수료 여부가 상이한 경우가 있었으며, 해당 사안에 대한 논의 발생\n     ◦ 질 관리의 목적으로 신입생을 대상으로 진행되는 새내기 멘토링, 그 외 소외계층(편입생, 전과생, 유학생, 새터민 등)을 대상으로 진행되는 적응 멘토링으로 구분 운영하였으나 신청자가 대폭 상승함에 따른 혼선이 야기되어 통합 운영하였음\n\n 2. 학습자 SOS 프로그램 취약요소\n   가) SOS 멘토링\n     ◦ 학생들의 정확한 성적 향상률을 파악하기 위하여 학사지원팀과 공문으로 소통하는 과정에서 재수강의 연유로 해당 사업 기간 내 장학금을 지급 받지 못한 학생을 확인하였음\n     ◦ 위기 학생에 대한 재정의가 필요함. 해당 멘토링에 참여하는 학생들은 저조한 성적을 받은 학생들이나, 실질적으로 멘토링 진행 시 성적 관리 이전 심리적 위축과 주변 환경을 개선하는 것이 시급한 것으로 판단됨\n  나) Step-Up 프로그램\n     ◦ 해당 프로그램의 기계획된 특강, 교수자와의 컨설팅 등은 학생의 중도탈락 관리에 실질적으로 미흡한 대책이라는 판단 아래 컨설턴트와의 1:1 컨설팅만 진행하였음\n     ◦ 참여 자유도를 높이기 위하여 비대면으로 진행되는 1:1 학습 컨설팅 진행 시 학생들의 소극적인 참여 및 불량한 학습 태도가 발견됨\n     ◦ 위기 학생에 대한 기준 설정과 더불어 유관 부서와의 협업 필요","improvement":"1. 삼육메이트 프로그램 개선계획\n     ◦ 신청서 및 보고서 양식을 세분화하고 리더(멘토)의 책임감을 증대시키기 위하여 활동 방식 전면 개선 계획\n     ◦ 활동 인증 여부에 따라 팀 내 수료 여부가 상이한 상황을 개선하고자 리더 중심의 활동 보고서 제출 및 수료 책임 강화 계획\n\n 2. 학습자 SOS 프로그램 개선계획\n   가) SOS 멘토링\n     ◦ 공문으로 소통 시 재수강 처리 이전 학점을 정확히 요청하여 해당 상황을 개선할 계획\n     ◦ 전공 학습 능력 강화를 목적으로 멘토링을 진행하되, 유관 부서(취업진로지원센터, 학생상담센터 등)와의 협업을 주도하여 전반적으로 학생을 케어할 수 있도록 체계 마련 계획\n  나) Step-Up 프로그램\n     ◦ 사전설문과 MLST-Ⅱ·LQS 검사를 통해 학사경고자의 학습 문제와 지원 요구를 사전에 파악함.\n     ◦ 1·2차 학습컨설팅과 학업개선계획서 작성을 연계하여 학생이 구체적인 학습목표와 실천계획을 수립하도록 함.\n     ◦ 단계별 참여 안내와 최종 활동보고서를 도입하여 참여자의 이수과정과 학업개선계획을 체계적으로 관리함."},{"projectName":"(혁신3)기초학습능력강화 프로그램(교수학습개발팀)","weakness":"- 특강 및 비교과 참여 안내가 제한적이어서 일부 학생들은 참여 기회를 놓치거나 사전 정보 습득에 어려움을 겪음.\n- 사전, 사후 시험이 e-class 상에 등록하기 어려운 양식이라 운영과 학생 참여에 번거로움이 있었음","improvement":"- 기존 온라인 특강 중심의 운영에서 AI 기초학력진단 결과에 기반한 맞춤형 보완학습 방식으로 개편함.\n- CAT 평가, 인증서 발급, SU-Plus 신청, 만족도조사 및 수료로 이어지는 운영 절차를 체계화함.\n- 과목별 진단 참여자에게 SU-Point를 지급하고 상시 운영을 확대하여 학생의 참여 접근성을 강화함."},{"projectName":"전공학습능력향상 프로그램 (위드(With) 프로그램) – 학습컨설팅, 학습공동체(교수학습개발팀)","weakness":"1. 학습공동체\n  - 활동 일정이 시험기간과 일부 중첩되면서 팀별 일정 조율과 운영 지속에 어려움이 발생함.\n  - 활동보고서 평가 기준이 엄격하게 운영되면서 실제 학습활동보다 보고서 작성 부담이 부각되는 한계가 있었음.\n  - 안정적인 대면 활동을 위한 교내 학습 공간 확보에 어려움이 있었음.\n\n2. 학습컨설팅 취약요소\n  - 학습컨설팅 종료 이후 학생들의 실제 학습행동 변화, 성적 개선 여부, 학습전략의 지속적 실천 여부를 체계적으로 확인하는 데 한계가 있었음.\n  - 상담을 통해 학습전략을 수립하더라도 이후 실행 및 점검 과정이 충분히 연결되지 않아, 컨설팅 효과를 실질적으로 파악하기 어려운 측면이 있었음.\n  - 참여가 자발성에 기반하고 있어 사후 상담이나 재방문을 지속적으로 유도하는 데 어려움이 있었으며, 이에 따라 중·장기적 성과 추적에 제약이 있었음.\n  - 성과지표상 참여자 수 목표와 실제 운영 규모 간 차이가 있어, 프로그램 특성을 반영한 지표 보완이 필요함.\n3. 학습법 특강\n  - 특강 및 비교과 참여 안내가 제한적이어서 일부 학생들은 참여 기회를 놓치거나 사전 정보 습득에 어려움을 겪음\n  - 특강과 만족도조사 참여일자 간의 공백으로 인한 만족도 조사 참여율 저조","improvement":"1. 학습공동체\n  - 시험기간과 활동 일정이 중첩되지 않도록 모집 기간을 단축하고 팀 선발을 조기에 완료하며, 시험기간 및 온라인 수업 주간에는 주 2회 활동인증이 가능하도록 운영하여 팀별 일정 조율의 어려움을 완화하고자 함.\n  - 활동보고서는 학습내용, 역할 분담, 다음 활동계획 등 핵심 항목 중심으로 간소화하여 실제 학습활동에 집중할 수 있도록 운영하고자 함. 학습공동체 결과보고서에는 보고서 중심 활동 경향이 문제점으로 제시되어 있음.\n  - 교내 학습공간 부족 문제를 줄이기 위해 오리엔테이션에서 사용 가능한 공간과 예약 방법을 구체적으로 안내하고, 필요 시 학습법 특강은 참여팀 수요를 확인한 후 선택적으로 연계하고자 함.\n\n2. 학습컨설팅\n  - 학습컨설팅은 초기상담, 학습진단, 전략 수립, 실천 점검, 종합상담, 사후 설문으로 이어지는 표준 운영 절차를 마련하고, 최소 1회의 실천 점검 단계를 포함하여 상담 이후의 실행 여부를 확인하고자 함.\n  - 상담 효과를 구체적으로 관리하기 위해 상담일지에 회기별 목표, 학생 실천과제, 다음 회기 점검사항을 공통 항목으로 반영하고, 후속 상담 시 이를 확인하는 방식으로 운영하고자 함.\n  - 성과지표는 단순 참여자 수 중심에서 벗어나 학습컨설팅 참여자 수, 3회 이상 지속 참여자 수, 실천 점검 완료 여부 등 프로그램 특성을 반영하는 지표로 보완하고자 함. 결과보고서에는 참여자 수 목표 250명 대비 실적 84명이 제시되어 있음. \n3. 학습법 특강\n  - 수톡 알림, 수플러스 연계 등 다양한 채널을 통해 사전 홍보를 강화하고, 온라인 강의 병행 및 시간대 다변화로 참여 장벽을 완화함\n  - 프로그램 종료 직후 모바일 QR코드 설문이나 현장 즉시 입력 방식을 도입하여 접근성을 높이고, 수플러스 연계는 추후 자동 반영되도록 시스템 개선을 추진함."},{"projectName":"(혁신2)SU-MVP교수법 적용 교과목 운영 및 연구(교수학습개발팀)","weakness":"* 결과보고서가 전반적으로 체계적으로 작성되고 있으나, 일부 항목에서는 교육성과 및 학습효과에 대한 분석을 보다 구체적으로 보완할 필요가 있음\n* 성찰 및 환류 항목 간 내용이 유사하게 작성되는 사례가 있어, 항목별 역할과 구분을 보다 명확히 할 필요가 있음\n\n* AI 및 에듀테크 기반 교수법 활용이 확대됨에 따라 교수자의 디지털 활용 역량을 지속적으로 강화할 필요가 있음* 강의실 네트워크 및 기자재 환경 등 디지털 수업 운영 여건에 대해 점진적인 개선의 필요성이 제기되어 관련 부서에 내용을 전달함.","improvement":"* 교수자 간 교수법 적용 역량 차이를 완화하기 위해 교수설계 교육과 맞춤형 컨설팅을 확대하여 수업 설계 및 운영 역량을 지속적으로 강화할 계획임\n* 플립드러닝 및 학습자 중심 교수법의 효과적 운영을 위해 교수설계 단계에서의 지원을 강화하고, 사례 중심의 교육을 통해 교수법 적용의 내실화를 도모할 예정임\n\n* AI 및 에듀테크 기반 교수법 활용 확대에 대응하여 관련 연수 및 교육 프로그램을 운영함으로써 교수자의 디지털 교수역량을 지속적으로 향상시킬 계획임\n\n* 교수설계 컨설팅 및 연수 프로그램 참여를 활성화하기 위해 다양한 참여 유인 방안을 마련하고, 프로그램 운영 방식을 개선하여 교수자의 참여도를 제고할 예정임\n* 동일 교과목 반복 참여에 대해서는 단계별 성과관리 체계를 도입하여 지속적인 수업 개선과 질적 고도화를 유도할 예정임\n* 사업 운영 성과를 체계적으로 분석하기 위해 데이터 기반 관리 및 연구 체계를 구축하고, 이를 통해 교수법 효과성 검증 및 정책 개선에 활용할 계획임"},{"projectName":"(혁신2)교수법 역량 강화 프로그램 운영(교수학습개발팀)","weakness":"학기 중 교육 참여 시간 부족에 대응하는 프로그램 개발 필요 교육과정에 대한 구체적이고 실제적인 적용 방법에 대한 실습 지원 필요효과적인 교육과정 지원을 위한 강의환경 제공교수 간 요구 수준의 차이를 충분히 반영 필요","improvement":"사전 수요조사 및 진단 문항을 통해 교수자의 교수법 역량 수준을 파악하고 맞춤형 프로그램 배치 필요FL 교육과정의 이론, 실습, 운영사례, Ai를 활용한 에듀테크 사용법을 지원하여 구체적이고 실제적인 학습을 지원교육 참여를 위한 방학 중 프로그램 운영 및 온라인 에듀테크 활용(zoom)PBL 교육과정의 이론, 실습, 운영사례, Ai를 활용한 에듀테크 사용법을 지원하여 구체적이고 실제적인 학습을 지원함\nPBL/FL 교육환경에 적합한 강의실 지원(다니엘관 107호 FL 강의실)"},{"projectName":"(혁신3)교수전문역량 향상 프로그램 운영(교수학습개발팀)","weakness":"최신 교육 트렌드를 반영한 혁신 교수법 및 교육 프로그램 제공 기회 확대 본교 교원의 참여 확대를 위한 요구조사 및 분석, 결과 적용전공 맞춤형, 수준별, 단계별 교수법 레벨업 운영이 필요교수지원 프로그램 간 연계 및 지속성 부족프로그램 참여 교원들의 만족도 및 요구도 조사를 기반으로 한 프로그램 운영 확대","improvement":"프로그램 만족도조사, 교원 사전 요구조사 및 역량진단 결과를 반영한 교육주제 선정ChatGTP 활용 등 인공지능(AI) 기반 에듀테크 교육 제공실시간 원격 교육 확대 및 e-class 기반 콘텐츠 제공으로 프로그램 접근성 강화단과대학 혹은 전공 특성에 맞는 프로그램을 기획 및 운영교수경력/역량수준을 고려한 수준별/단계별 프로그램 운영"},{"projectName":"교수력 향상프로그램(대교협 및 기타 연수 지원)(교수학습개발팀)","weakness":"대교협 외 다양한 연수지원 시도(대교개협, 한림대, 한양대 등)교육연수 일정 사전 공지 및 신청 절차 개선연수한 교수법 프로그램 연계 교내 교수법 워크숍 확산","improvement":"교수 맞춤형 연수->학습->확산 모델 체계화국내·외 연수지원 범위 및 질적 수준 확대성과 관리 및 참여 유도 체계 고도화교육연수 일정 사전 공지 및 운영 방법 개선"}],"submissi te":"C","performancePlan2026":"2025년 교양교육원은 글로컬영어 교양필수 교과목 운영과 2학기 말 무비페스티벌 개최, 교양교육 교과목 개발 및 운영, 지자체 고교연계 지역인재육성사업, 경기공유학교 운영을 중심으로 대학의 교양교육 혁신과 지역사회 연계 강화를 추진하였다. 글로컬영어 사업은 1·2학기 교과목 운영비 지원과 무비페스티벌을 연계하여 학생들이 수업에서 학습한 영어 의사소통 능력을 영상 기획·제작, 팀별 협업 및 발표 활동에 활용할 수 있도록 운영하였다. 해당 사업은 조정예산 55,000,000원 중 54,892,710원을 집행하여 99.8%의 높은 예산 집행률을 달성하였다. 교양교육 교과목 개발 및 운영 사업에서는 기존 종이 교재를 디지털 기반의 앱북으로 전환하여 학생들의 학습 접근성과 편의성을 높이고자 하였으며, 일반용역비는 전액 집행하였으나 행사비가 미집행되어 전체 예산 집행률은 68.25%로 나타났다.  \n지자체 고교연계 지역인재육성사업은 지역 고등학생들에게 대학의 교육시설과 전공 인력을 활용한 진로·전공 체험 프로그램을 제공함으로써 지역인재 육성과 대학의 지역사회 기여 기능을 강화하였다. 경기공유학교는 교육지원청 및 지역 학교와의 협력을 바탕으로 대학 연계형 교육과정을 운영하고, 온라인·오프라인 수업 모니터링과 운영협의회를 통해 프로그램의 안정적인 운영과 교육의 질 관리를 추진하였다. 이를 통해 교양교육원의 역할을 재학생 대상 교양교육에 한정하지 않고 지역 청소년과 지역사회로 확대하였다는 점에서 의미 있는 성과가 있었다.\n다만 교양교육 만족도는 목표 60% 대비 56.3%로 나타나 목표에 다소 미달하였으며, 기존 성과지표가 교양교육 전반의 만족도 중심으로 설정되어 글로컬영어, 무비페스티벌, 앱북 활용 및 지역연계 프로그램의 직접적인 교육성과를 객관적으로 확인하는 데 한계가 있었다. 또한 앱북의 실제 이용률과 학습효과에 대한 분석이 충분하지 않았고, 고교연계 프로그램 운영 과정에서는 학생 이동 동선, 점심시간 운영, 활동소감문 작성 및 수료식 시간 확보, 실험·실습 보조인력 부족 등이 개선과제로 확인되었다. 경기공유학교 역시 프로그램별 참여율, 이수율, 만족도 및 학습성과를 일관된 기준으로 관리할 수 있는 체계가 필요한 것으로 분석되었다.\n\n이에 따라 차년도에는 각 사업별 운영실적을 개별적으로 관리하면서도 부서 차원에서 통합적으로 점검할 수 있는 성과관리 및 환류체계를 구축하고자 한다. 글로컬영어는 외국어교육 만족도 80% 이상을 목표로 교과목 이수율, 무비페스티벌 참여율, 작품 제출률 및 영어 의사소통 역량을 관리하고, 교양교육 교과목 개발 사업은 앱북 접속률, 활용 빈도, 학생 만족도 및 학습효과를 정기적으로 분석할 계획이다. 또한 퀴즈, 영상, 자기점검 및 피드백 기능을 보완하여 앱북의 활용도를 높이고 적용 교과목도 단계적으로 확대하고자 한다. 지자체 고교연계 지역인재육성사업과 경기공유학교는 사전 운영협의를 강화하고, 학생 이동 동선과 세부 일정을 조정하며, 실험·실습 보조인력을 충분히 확보하여 프로그램 운영의 안정성을 높일 예정이다. 아울러 참여인원, 출석률, 이수율, 만족도, 수업 결과물 및 개선의견을 공통 성과지표로 관리하고, 학기별 점검과 사업 종료 후 성과분석 결과를 차년도 교육과정과 운영계획에 반영함으로써 교양교육의 질적 향상과 지역사회 연계사업의 지속적인 성장을 도모하고자 한다.","performancePlan2026Source":"ir_comment","performancePlan2026Meta":{"raw":"2025년 교양교육원은 글로컬영어 교양필수 교과목 운영과 2학기 말 무비페스티벌 개최, 교양교육 교과목 개발 및 운영, 지자체 고교연계 지역인재육성사업, 경기공유학교 운영을 중심으로 대학의 교양교육 혁신과 지역사회 연계 강화를 추진하였다. 글로컬영어 사업은 1·2학기 교과목 운영비 지원과 무비페스티벌을 연계하여 학생들이 수업에서 학습한 영어 의사소통 능력을 영상 기획·제작, 팀별 협업 및 발표 활동에 활용할 수 있도록 운영하였다. 해당 사업은 현실적인 대응 대책\n① 1단계: 인도적 학업 유지 패키지 지원 (이탈 방지)- 야간·주말 특별반 개설: G-1 자격 취득 후 생계를 위해 근로 활동을 병행해야 하는 학생들을 위해 주말이나 야간에 한국어 수업을 들을 수 있도록 유연한 학사 과정 운영.- 장학금 및 분할 납부 제도: 본국 송금이 전면 차단된 사정을 고려해, 교내 '글로벌 파트너십 장학금' 등을 신설하거나 등록금을 월별 분할 납부할 수 있도록 제도를 개선하여 학업 포기 차단\n②  2단계: 대학 내 '안전망' 구축 및 지역사회 연계 근로- 행정 보조, 다문화 교육 강사, 통·번역 요원 등 교내에서 합법적으로 근로 장학금을 받을 수 있는 일자리 우선 배정- 지자체 및 지역 기업과 연계하여 이들이 합법적인 테두리 내에서 아르바이트를 하며 학업을 마칠 수 있도록 매칭 지원\n③ 3단계: 법무부 출입국 및 유관 부처 건의- 인도적 체류 자격(G-1)을 가진 외국인이 어학연수 및 대학 교육을 지속할 수 있도록 타 대학과 연대하여 표준 가이드라인 제정 및 재정 지원을 교육부와 법무부에 공동 건의.\n\n3.  안정적 국가 대상 신규 모집 및 홍보 방안① 동남아시아 (안정권)\t: 말레이시아, 싱가포르소득 수준이 높고 중산층 비중이 큼. K-Pop 및 K-Beauty에 대한 충성도가 매우 높으며 한국 유학 비용 감당 능력이 충분함.② 유럽 : 폴란드, 체코, 루마니아한국 대기업(방산, 원전, 배터리 등)의 대규모 진출로 현지 내 한국어 구직 수요가 폭증함. 학구열이 높고 불법체류율이 극히 낮음.③ 중동 (친한 국가): 사우디아라비아, UAE국가적 차원에서 한국과의 교류를 확대 중이며, 현지 부유층 자녀들 사이에서 한국 문화가 트렌드로 자리 잡음. 정부 장학생 유치 가능성 높음.④ 동아시아: 대만, 일본지리적으로 가깝고 소득 수준이 안정적임. 학위 취득 목적보다는 '워킹홀리데이'나 '단기 어학연수(10주~20주)' 중심의 순수 학습 수요가 매우 강함.\n4. 타겟 맞춤형 홍보 및 모집 전략① 사설 유학원 의존 탈피, 현지 방문 직접 홍보 필요: 사설 유학원의 경우 수수료 목적으로 불법체류 가능성이 높은 고위험군 학생이 유입되기 쉬움. 따라서, 현지 한국어 교육 기관(세종학당, 한글학교) 및 자매결연을 맺은 고등학교 및 SDA 학교와의 협력을 통해 본교 입학 설명회를 직접 개최하고, 총장 추천 전형을 통해 검증된 학생만 선발.② 인플루언서 및 뉴미디어 기반 '캠퍼스 라이프' 브랜딩 (일본 및 중동)- 외국인 재학생 앰배서더 운영: 현재 재학 중인 서구권, 일본 국적 유학생들을 '글로벌 크리에이터'로 임명하여 인스타그램 릴스, 틱톡, 유튜브 쇼츠에 브랜딩 콘텐츠 정기 발행- 안전하고 아름다운 캠퍼스 강조: 한국의 치안 강점, 세련된 대학가 문화, 전통과 현대가 어우러진 서울(혹은 수도권)의 일상을 세련된 영상미로 노출해 한국 문화 자체를 선호하는 잠재 학생들의 팬덤 형성\n5. 대학 내부 인프라 및 신뢰도 강화 대책삼육대학교 및 한국어학당의 모집 경쟁력을 장기적으로 유지하기 위해서는 입국 후 학생들이 느낄 체감 만족도를 높여 입소문 효과(Viral) 필요\n① 1:1 버디 프로그램(한국 대학생 매칭) 내실화: 외국인 학생과 대학 본과 재학생을 매칭하여 주 1~2회 전공 학습, 한국어 프리토킹, 캠퍼스 적응을 돕는 '버디 마일리지 제도' 운영. (참여 한국 학생에게는 사회봉사 시간 또는 비교과 마일리지를 부여해 적극 참여 유도)\n② K-컬처 융합형 특별 활동 개설: 전통적인 판소리나 한복 체험에서 벗어나, 학생들이 가장 선호하는 실질적인 문화 활동(예: K-Pop 전문 댄스 스튜디오 강습, 퍼스널 컬러 진단, 트렌디한 명소 탐방 등)을 정규 학기 중 정기 편성.\n③ 심리 정서 안전망 구축: 장기 분쟁 국가(러시아, 우크라이나, 미얀마 등) 학생들뿐만 아니라 모든 유학생이 낯선 타국 생활에서 겪는 우울증, 슬럼프를 예방하기 위해 언어 장벽이 없는 전문 다국어 심리 상담 프로그램을 정기 운영하여 '정서적으로 가장 안전하고 따뜻한 대학'이라는 브랜딩 강화.\n6. 공격적 리팀 운영"},{"projectName":"해외교포 한국어 및 한국문화 단기연수 프로그램(국제교육원)","weakness":"프로그램 운영 규모 확대에 따라 행정 및 운영 업무가 증가하고 있으며, 참가 학생들의 기대 수준 또한 높아지고 있음. 특히 본 프로그램은 참가자 1인당 높은 수준의 교육·문화 체험 비용이 투입되는 국제 단기연수 프로그램인 만큼, \n단순 운영이 아닌 프로그램 품질, 학생 만족도, 안전관리, 문화체험 완성도 등을 종합적으로 고려한 운영이 요구됨. 이에 따라 숙박, 교통, 문화체험, 학생 지원 및 현장 운영 전반에서 지속적인 품질 관리 필요성이 증가하고 있음.","improvement":"참가 학생들의 교육 및 문화체험 만족도를 높이고 프로그램 경쟁력을 강화하기 위해 운영 품질 중심의 프로그램 체계를 지속적으로 고도화하고자 함. 학생 수요와 국제 프로그램 수준에 맞춘 문화체험, 현장학습, 학생 지원 서비스를 강화하고, \n사전 운영 점검 및 현장 대응 체계를 체계화하여 안정적인 프로그램 운영이 가능하도록 개선할 예정임. 또한 참가 학생 경험 및 만족도 분석을 바탕으로 향후 프로그램 콘텐츠를 지속적으로 보완·발전시켜 국제 단기연수 프로그램의 질적 수준을 강화하고자 함."},{"projectName":"학부과정 유학생유치 확대(국제교육원)","weakness":"(1) 박람회 성과의 불확실성단기간 행사로 실제 등록까지 이어지는 비율 예측의 어려움\n국가별 관심 전공 및 수요 편차 존재\n(2) 유학원 의존 구조유학원 역량에 따른 모집 실적 편차\n과도한 수수료 요구 가능성\n부정확한 정보 전달로 인한 민원 발생 가능성\n(3) 입시 업무 과중서류 검토, 면접, 비자 관련 안내 등 행정 부담 가중\n특정 시기에 업무 집중으로 인한 인력 피로도 증가\n(4) 예산 대비 효과 분석의 한계여비, 홍보비, 수수료, 수당 등 다양한 예산 항목이 혼재\n직접적인 모집 성과와 예산 집행의 상관관계 정량화의 어려움","improvement":"(1) 박람회 참여 전략 고도화국가별·전공별 수요 분석 후 선별적 박람회 참여\n박람회 이후 상담 학생에 대한 지속적 추적 관리 체계 구축\n(2) 유학원 관리 체계 강화유학원별 모집 실적 데이터 관리\n수수료 기준 표준화 및 계약 재정비\n정기적인 정보 공유 및 교육을 통한 정확한 입학 정보 전달\n(3) 입시 업무 프로세스 개선외국인 전형 업무 매뉴얼 표준화\n업무 분담 체계 확립으로 특정 시기 업무 과중 완화\n입시 수당 지급 기준 명확화\n(4) 예산 대비 성과 관리 체계 마련예산 항목별 모집 실적 연계 관리\n박람회, 유학원, 개별 상담 경로별 등록 기여도 분석\n차년도 예산 편성 시 성과 기반 반영"},{"projectName":"한국어과정 운영(국제교육원)","weakness":"1. VISA 거절에 따른 등록 취소\n2. 불법체류의 목적을 가진 학생에 대한 서류, 면접의 한계","improvement":"1. VISA 발급이 용이한 국적의 학생 적국 수용\n2. 불법체류의 목적을 가진 학생에 대한 서류, 면접의 한계점 보완 필요"},{"projectName":"한국어과정 학생유치 확대(국제교육원)","weakness":"","improvement":""},{"projectName":"외국인 유학생 대학생활 적응 및 지원프로그램 운영(국제교육원)","weakness":"가. 프로그램 참여율의 편차 발생\n입국 시기, 한국어 능력, 학업 일정, 국적별 커뮤니티 차이에 따라 프로그램 참여율에 차이가 발생할 수 있음.특히 중도 입국자, 한국어 미숙자, 학부·대학원 과정별 일정 차이로 인해 일부 학생의 참여가 제한될 수 있음.나. 개별 상담 및 지원 수요 증가\n학업, 체류, 생활, 심리, 진로 등 유학생 지원 요구가 다양해지고 있으나, 개별 상담 및 자국어 지원에는 하계가 있음.비자 및 체류관리와 관련된 행정 수요가 집중되는 시기에는 신속한 개별 대응에 어려움이 발생할 수 있음.다. 일회성 행사 중심 운영의 한계\n환영회, 체육대회, 명절행사, 송년회 등 행사 중심 프로그램은 유학생 만족도 향상에는 효과가 있으나, 장기적인 관계 형성과 지속적인 적응 지원에는 한계가 있음.라. 멘토링 프로그램의 지속성 관리 필요\n멘토·멘티 매칭 이후 실제 활동 지속 여부와 활동의 질을 체계적으로 관리할 필요가 있음.멘토링 활동보고서, 만족도 조사, 중간 점검 등 후속 관리가 강화될 필요가 있음.마. 성과 관리 자료 축적 필요\n프로그래별 참여 인원, 만족도, 상담 건수, 주요 민원 유형, 개선 요청사항 등을 체계적으로 축적할 필요가 있음.향후 교육국제화역량 인증제 및 유학생 지원 성과 관리와 연계할 수 있도록 정량·정성 자료 관리가 요구됨.","improvement":"가. 유학생 안내체계 강화\n국제처 홈페이지, LMS, SNS, 단체 채팅방 등을 활용하여 프로그램 안내를 다국어로 제공함.학기 초, 방학 전, 체류기간 만료 전 등 주요 시기별 안내 일정을 체계화하여 정보 누락을 줄임.나. 멘토링 프로그램 운영 내실화\n멘토·멘티 매칭 시 전공, 언어, 국적, 학년, 관심 분야 등을 고려하여 매칭 기준을 강화함.멘토 사전교육을 실시하여 유학생 지원 시 필요한 기본 태도, 상담 범위, 행정 안내 기준을 공유함.활동보고서 및 만족도 조사를 통해 운영 결과를 점검하고 차년도 프로그램에 반영함.다. 유학생 선배 리더 및 외국인 조교 활동 확대\n유학생 선배 리더를 양성하여 신규 유학생의 초기 적응을 지원함.국적별·언어권별 학생 리더를 활용하여 자국어 안내와 생활 정보 공유를 강화함.라. 상담 및 체류관리 지원체계 정비\n학업, 생활, 체류, 진로 상담 내용을 유형별로 정리하여 반복되는 문의에 대한 표준 안내자료를 마련함.비자 연장, 외국인등록, 아르바이트 허가 등 주요 행정 절차에 대한 안내자료를 정기적으로 업데이트함.마. 문화체험 프로그램 확대 및 정례화\n유학생 수요가 높은 한국문화 체험 프로그램을 정례화하여 참여 기회를 확대함.명절행사, 체육대회, 송년회 외에도 지역사회 연계 문화체험, 한국 학생과의 교류 프로그램 등을 검토함.바. 성과 환류 체계 구축\n프로그램 종료 후 만족도 조사를 실시하고, 주요 개선 의견을 차년도 계획에 반영함.프로그램별 참여율, 만족도, 상담 건수, 개선 요청사항 등을 정리하여 유학생 지원정책 수립의 기초자료로 활용함."},{"projectName":"교환학생 프로그램 운영(국제교육원)","weakness":"영어 트랙 및 외국인 학생들을 위한 수업 개설 및 학과 운영을 통해 교환 학생들이 참여할 수 있는 수업이 늘어났으나 학점 인정 및 언어의 장벽으로 인해 초청 교환학생들이 참여할 수 있는 수업이 아직까지는 제한적이고 학생들의 어학 성적 향상은 긍정적인 방향으로 가고 있으나 문화 적응 지원이 더 필요하다는 피드백이 있어, 문화적응 프로그램을 보강하는 방식으로 환류가 이루어지도록 추진 중.","improvement":"영어 트랙 및 외국인 학생들을 위한 수업 개설 및 학과 운영을 통해 교환 학생들이 참여할 수 있는 수업 및 활동의 폭을 늘리고자 함.\n사전에 수업 관련 내용을 주고 받으며 학점 인정 및 가능성을 미리 확보할 수 있도록 함"},{"projectName":"입학성적우수자 단기유학 및 어학연수 추진(국제교육원)","weakness":"제한된 협약 대학 및 프로그램으로 인한 참여 부족홍보 부족으로 인한 대상 학생 참여 저조","improvement":"교내 홍보 활동을 통한 해당 프로그램 인지도 상승 기대"}],"submission":{"status":"not_submitted","files":[],"contact":{"name":"김두한","email":"doohk@syu.ac.kr"},"annualReport2025PdfHref":"","remarks":["미제출인데 IR 성과관리계획(2026)에 실질 내용이 입력되어 있음 (보기 버튼과 제출 상태 불일치)"],"hasAnomaly":true},"annualReport2024PdfHref":"annual_reports/2024/국제교육원.pdf","annualReport2025IrPdfHref":"annua jectName":"정부 및 각종 봉사단체 지원사업 참여(사회봉사단)","weakness":"가. 재능봉사캠프 운영\n  1) 본 캠프는 지도교수나 인솔자 없이 멘토팀이 자율적으로 운영되기 때문에 활동 중 발생하는 문제 상황에 대한 즉각적인 피드백이나 지원이 어려움\n\n나. 대학 자체개발 해외봉사 프로그램 운영\n  1) 언어 장벽으로 인해 교육 진행 속도 저하\n  2) 고온다습한 기후로 인한 체력적 부담 및 일부 학생들의 건강 문제 발생\n  3) 환율 상승 및 예산 집행 지연으로 항공권 비용 증가 문제 발생","improvement":"가. 재능봉사캠프 운영\n  1) 현재 50%이상으로 권장하고 있는 현장점검 모니터링 활동을 100% 확대  \n나. 대학 자체개발 해외봉사 프로그램 운영\n  1) 현지어 학습 프로그램을 체계화하여 차기 봉사대 파견 시 적용 예정 및 현지 통역 인력 확보 및 교육 진행\n  2) 기후 적응 훈련 및 대비 물품을 사전에 준비하고, 휴식 시간을 충분히 포함하여 일정 운영 시 체력 소모 분산\n  3) 예산 집행 절차를 조기 확정하여 지연 없이 집행 가능하도록 내부 프로세스 개선"},{"projectName":"수요맞춤형 봉사프로그램 운영(국내봉사대)(사회봉사단)","weakness":"﻿가. 지원금 사용 규정 개선 필요성\n  1) 정산 절차 간소화로 봉사자·부서 업무 경감\n  2) 지원금 사용 가능 범위를 세부적으로 명시해 혼동 방지 필요\n  3) 영수증 부착 및 제출 조건 미충족 사례 다수 발생 → 규정 강화 필요\n나. 모니터링 출장 방식 개선\n  1) 국내봉사대 봉사활동 기간(7월 초)에 일정 집중 → 3일간 7팀 모니터링 계획\n  2) 활동 장소가 전국에 분포되어 있어 업무 수행 차질 가능성 큼\n  3) 온라인·오프라인 혼용 방식으로 모니터링 개선 필요\n다. 성과점검 설문지 양식 통합\n  1) 현재 기관 만족도 설문지만 존재\n  2) 대학생 봉사자·수혜자 대상 설문을 추가하여 통합 필요\n  3) 정량·정성적 평가를 강화해 성과점검 효과 제고","improvement":"가. 오리엔테이션 시 매뉴얼·설명 강화\n  1) 지도교수 및 학생 대표가 제도와 절차를 충분히 인지할 수 있도록 안내 필요\n나. 문서 양식 점검 및 개선\n  1) 참가신청서, 결과보고서, 회의록 작성을 재검토·개선\n  2) 봉사활동 운영의 효율성과 효과성 제고\n다. 지원 강화\n  2) 체계적 문서 관리와 사전 안내를 통한 봉사활동이 원활히 진행되도록 지원"}],"submission":{"status":"submitted","files":[{"name":"총장직속기관 글로컬사회혁신원-150.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EC%B4%9D%EC%9E%A5%EC%A7%81%EC%86%8D%EA%B8%B0%EA%B4%80%20%EA%B8%80%EB%A1%9C%EC%BB%AC%EC%82%AC%ED%9A%8C%ED%98%81%EC%8B%A0%EC%9B%90-150.pdf","hasPdf":true,"gwSource":"결재한문서함","worklistid":"892422"},{"name":"총장직속기관 글로컬사회혁신원-169.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EC%B4%9D%EC%9E%A5%EC%A7%81%EC%86%8D%EA%B8%B0%EA%B4%80%20%EA%B8%80%EB%A1%9C%EC%BB%AC%EC%82%AC%ED%9A%8C%ED%98%8 ":"행정협의회 운영(기획처)","mgmtType":"지정안됨","budget":null,"budgetExecRate":null,"budgetExecApplied":false,"projectExecRate":null,"busiGbn":"113","cd":"1865","yyyy":"2026","pdfPath":null,"planHtmlPath":null,"plan2026HtmlPath":"html/기획처/행정협의회 운영(기획처)_plan2026.html","resultHtmlPath":null,"budget2026":0},{"name":"휴먼-ICT 융합 특성화(기획처)","mgmtType":"지정안됨","budget":null,"budgetExecRate":null,"budgetExecApplied":false,"projectExecRate":null,"busiGbn":"113","cd":"2249","yyyy":"2026","pdfPath":null,"planHtmlPath":null,"plan2026HtmlPath":"html/기획처/휴먼-ICT 융합 특성화(기획처)_plan2026.html","resultHtmlPath":null,"budget2026":0}],"feedback":[{"projectName":"학과 실무실습(기획처)","weakness":"","improvement":""},{"projectName":"경영성과 프로그램 개선(BI 고도화) 및 운영(기획처)","weakness":"행정 부담 가중: 사업 범위 확대에 따른 정산·보고 등 행정 절차의 복잡성 증대.\n참여 편차 발생: 인지도 부족 및 홍보 단일화로 인한 프로그램 간 참여율 불균형.\n운영 체계의 미비: 부서 간 조사/일정 중복, 현장 기관과의 사전 협의 부족 등 사전 관리 체계의 미흡.\n환류의 한계: 단발성 운영으로 인한 심화 과정 부족 및 실질적인 인식·행동 변화 추적 지표 미흡.","improvement":"① 행정 효율화 및 표준화\n표준 운영 매뉴얼 도입: 정산 및 결과보고 절차 표준화로 행정 누수 방지.\n통합 플랫폼 안정화: 산재된 시스템 통합 및 유지보수 강화로 운영 오류 최소화.\n② 수요 기반 타겟팅 전략\n사전 수요조사 강화: 학생 및 지역사회 요구를 사전 파악하여 맞춤형 프로그램 구성.\n다각적 홍보 전개: 홍보 방식을 온라인뿐 아니라 학과 연계 등 타겟별 방식으로 전환하여 인지도 제고.\n③ 데이터 기반 성과관리 고도화\n성과 관리 체계 구축: 단기 체험을 단계형(기초-심화-연계) 모델로 전환하여 교육 연속성 확보.\n사후 추적 관리 도입: 고위험군 관리 및 인식 변화를 측정하는 지표를 보완하여 실질적 변화를 데이터로 추적.\n④ 현장 대응력 및 연계 강화\n리스크 선제 대응: 지자체·현장 기관과 MOU 체결 및 사전 점검을 통해 리스크 대응 체계 마련.\n자원 최적화: 중복 사업은 과감히 통합·종료하고, 우수 사례 공유를 통해 교육 품질의 상향 평준화 실현."},{"projectName":"(혁신3)ICT 역량강화 교육환경 구축 및 운영(기획처)","weakness":"▪ 사업 선정 시기 조기화 및 행정 프로세스 정례화: 학과의 환경개선 제안에 따른 최종 사업 선정 시기가 지연됨에 따라, 이후 진행되는 입찰 공고, 물품 구매, 현장 납품 및 시공 등의 전체 일정이 촉박하게 진행되고 있습니다. 이로 인해 학기 개강 전 공사 완료에 차질이 발생하거나, 급격한 추진으로 인한 행정적 오류의 위험이 존재합니다.\n   ▪ 부서 간 R&R(역할과 책임) 명확화 및 협업 체계 구축: 구매, 입찰, 시설 관리 등 각 단계별 전문 담당 부서가 분리되어 있음에도 불구하고, 실질적인 행정 업무의 상당 부분이 사업 담당 부서에 집중되어 업무 과부하가 발생하고 있습니다. 이는 부서 간 유기적인 협업을 저해하고 행정 효율성을 저하시키는 원인이 됩니다.\n   ▪ 중장기 환경개선 로드맵 수립 및 수요자 중심 사업 추진: 매년 지속되는 사업임에도 불구하고 명확한 연차별 마스터플랜이 부재하여, 학과 현장의 실질적인 필요나 제안보다는 단기적인 정책적 결정에 의해 환경개선 방향이 좌우되는 경향이 있습니다. 이로 인해 학과별 특수성이 반영된 맞춤형 환경 개선에 한계가 발생하고 있습니다.","improvement":"▪ 사업 선정 시기 조기화 및 행정 프로세스 정례화: 차년도 사업의 경우 전년도 하반기 내에 대상 학과 및 사업 범위를 조기 확정하는 '사전 확정제'를 도입하겠습니다. 이를 통해 충분한 입찰 기간과 제작 기간을 확보하여 학사 일정에 차질 없는 안정적인 환경개선 프로세스를 정착시키겠습니다.\n ▪ 부서 간 R&R(역할과 책임) 명확화 및 협업 체계 구축: 사업 기획, 계약(구매/입찰), 시공 관리 등 단계별 부서 간 역할 분담(R&R)을 명문화한 가이드를 수립하겠습니다. 전문 부서의 행정 지원 범위를 명확히 규정하고, 정기적인 실무 협의체를 가동하여 사업 추진 전 과정에서 행정적 전문성과 효율성을 동시에 확보하겠습니다.\n ▪ 중장기 환경개선 로드맵 수립 및 수요자 중심 사업 추진: 대학 전체의 시설 노후도와 학과별 요구사항을 종합적으로 분석한 '3~5개년 중장기 환경개선 로드맵'을 수립하겠습니다. 정기적인 수요 조사를 통해 학과별 우선순위를 도출하고, 정책적 방향과 현장의 요구가 조화를 이루는 데이터 기반의 체계적인 환경개선 사업을 추진하겠습니다."},{"projectName":"보직자 대외활동 지원(기획처)","weakness":"","improvement":""},{"projectName":"정부 재정지원사업 참여TFT 운영(기획처)","weakness":"","improvement":""},{"projectName":"예비비(기획처)","weakness":"","improvement":""},{"projectName":"대학발전계획 추진(기획)(기획처)","weakness":"성과관리시스템을 활용하여 부서별 실적을 관리하고 있으나, 시스템 오류 및 양식 관련 실무 문의가 지속적으로 발생하여 담당 부서와 참여 부서의 행정 부담이 일부 발생함.\n\n또한 부서별 성과보고서 작성 수준과 지표 이해도에 차이가 있어, 일부 부서의 경우 실적 작성 내용의 구체성 및 정량·정성 평가자료의 충실도가 다소 부족한 것으로 확인됨.\n\n대학발전계획의 실행과제별 목표 달성도를 높이기 위해서는 단순 실적 취합을 넘어, 부서별 성과 분석 결과가 차년도 사업계획 및 예산 편성에 보다 명확하게 연계될 필요가 있음.","improvement":"성과관리 시스템화\n기존 서류 중심의 성과관리 방식을 시스템 기반 관리체계로 전환하여 부서별 실적 입력, 보고서 작성, 점검·분석 과정의 효율성을 제고함.\n\n양식 및 시스템 개선\n성과평가 양식과 성과관리시스템을 지속적으로 개선하여 실적 입력 및 보고서 작성 과정에서 발생하는 오류와 불편사항을 보완함.\n\n작성 기준 구체화\n지표별 작성 기준과 점검 기준을 구체화하여 부서별 성과보고서의 일관성과 완성도를 높임.\n\n평가 결과 환류 강화\n발전전략위원회 자문 및 심의 결과를 바탕으로 우수성과는 확산하고 미흡 과제는 개선하여 차년도 사업계획, 예산 조정, 사업 우선순위 설정에 반영함."}],"submission":{"status":"submitted","files":[{"name":"기획처 기획팀-134.pdf","href":"","hasPdf":false,"gwSource":"통합문서함","worklistid":"790079"},{"name":"기획처 기획팀-142.pdf","href":"","hasPdf":false,"gwSource":"통합문서함","worklistid":"888343"}],"contact":{"name":"조재림","email":"adventistcho@syu.ac.kr"},"annualReport2025PdfHref":"","remarks":["제출 PDF(기획처 기획팀-134.pdf) 파일을 확인할 수 없음","제출 PDF(기획처 기획팀-142.pdf) 파일을 확인할 수 없음"],"hasAnomaly":true},"annualReport2024PdfHref":"annual_reports/202 도모함\n\n[문화의 날 행사]\n정당한 사유나 사전 연락 없이 불참한 인원에 대해서는 '차기 문화 행사 및 생활교육원 주관 복지 프로그램 참여 제한' 등의 실질적인 페널티를 부과함\n\n[살렘관 간담회]\n층별 대표 인원을 지정 참여하게 함으로써, 참여 인원이 적더라도 전체 관생의 의견이 골고루 반영될 수 있는 대의적 소통 체계를 구축함."},{"projectName":"신학숙 생활교육(생활교육원)","weakness":"<만족도 조사 결과>\n- 통금 시간 연장\n- 소음 관련 민원\n- 공용시설 청소상태 불량","improvement":"- 점호 면제권 확대\n- 소음 민원 해결\n- 청소상태 개선 조치"},{"projectName":"에덴관 생활교육(생활교육원)","weakness":"1. 입사 오리엔테이션을 전관 통합으로 운영함에 따라 각 생활관별 특성 및 운영 사항에 대한 안내가 미비함\n\n2. 입·퇴사 시 안내사항 전달이 일방향 공지에 그쳐 일부 관생의 이해도 부족 및 반복 문의 발생\n\n3. 관생자치 프로그램 및 간담회 참여율이 저조하고, 일부 관생 의견에 편중되는 경향이 있음\n\n4. 만족도 조사 응답률이 낮아 전반적인 의견 수렴에 한계 존재\n\n5. 법정의무교육(소방교육)의 참여율 편차 및 형식적 참여로 인해 교육 효과가 다소 미흡함","improvement":"1. 각 생활관별 특성을 반영한 맞춤형 입사 오리엔테이션을 별도로 운영하여 안내의 정확성과 이해도 제고\n\n2. 입·퇴사 안내 시 체크리스트, FAQ 등 시각자료를 활용하여 전달력 강화 및 사전 안내 체계 개선\n\n3. 간담회 운영 방식 개선(시간대 다양화, 소규모 운영 등)을 통해 참여율 제고 및 다양한 의견 수렴\n\n4. 만족도 조사 참여 독려 방안 마련 및 익명성 보장 안내를 통해 응답률 향상\n\n5. 법정의무교육 사전 안내 및 참여 관리 강화, 사례 중심 및 체험형 교육 도입으로 실효성 제고"},{"projectName":"브니엘관 생활교육(생활교육원)","weakness":"- 통금 시간 연장\n- 소음 관련 민원\n- 공용시설 청소상태 불량","improvement":"- 점호 면제권 확대\n- 소음 민원 해결\n- 청소상태 개선 조치"},{"projectName":"시온관 생활교육(생활교육원)","weakness":"<만족도 조사 결과>\n- 통금 시간 연장\n- 소음 관련 민원\n- 공용시설 청소상태 불량","improvement":"- 점호 면제권 확대\n- 소음 민원 해결\n- 청소상태 개선 조치"}],"submission":{"status":"submitted","files":[{"name":"생활교육원-58.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EC%83%9D%ED%99%9C%EA%B5%90%EC%9C%A1%EC%9B%90-58.pdf","hasPdf":true,"gwSource":"결재한문서함","worklistid":"892423"},{"name":"생활교육원-92.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EC%83%9D%ED%99%9C%EA%B5%90%EC%9C%A1%EC%9B%90-92.pdf","hasPdf":true,"gwSource":"통합문서함","worklistid":"791656"}],"contact":{"name":"최정환","email":"cjh629@syu.ac.kr"},"annualReport2025PdfHref":"file:///F:/%EA%B8%B0 \n산학협력 MOU 기업과 R&D 프로젝트 참여기업을 대상으로 인턴십 수요조사를 실시하고, 프로젝트 참여 학생이 인턴십과 취업으로 연계될 수 있도록 매칭체계를 구축한다. 학과자율형 인턴십, 단기 현장실습, 방학 집중형 인턴십을 확대하고, 인턴십 참여율과 취업연계율을 별도 성과지표로 관리한다.\n     \n3. 자유전공학부 신설에 따른 SW전공 유입 불확실성\n자유전공 학생을 대상으로 SW전공 설명회, 진로상담, 선수과목 안내, AI리터러시 교과 연계 프로그램을 운영한다. SW전공 체험형 비교과, 마이크로전공, 기초 코딩캠프를 통해 SW전공 진입장벽을 낮추고, 전공 선택 데이터를 지속적으로 분석하여 학생 유입 전략을 수립한다.\n     \n4. SW융합교육 만족도 개선 필요\n융합전공별 난이도 체계를 초급, 중급, 심화 단계로 구분하고, 비SW전공 학생을 위한 사전 기초교육과 온라인 보충학습 콘텐츠를 제공한다. 또한 전공별 맞춤형 이수 로드맵, 멘토링, 학습상담, 장학지원 체계를 강화하여 이수율과 만족도를 높인다.\n     \n5. 산학프로젝트 질 관리체계 고도화 필요\n프로젝트 선정, 중간점검, 최종평가, 후속관리로 이어지는 단계별 평가체계를 강화한다. 산업체 전문가 평가를 확대하고, 결과물을 지식재산권, 기술이전, 창업, 논문, 취업으로 연계할 수 있도록 후속지원 프로그램을 운영한다. 우수 프로젝트는 차년도 R&D형 과제로 연계한다.\n     \n6. 예산 집행률 및 이월금 관리 필요\n차년도에는 분기별 예산 집행점검을 실시하고, 프로그램 공모, 장비구매, 인력운영, 장학금 지급 일정을 조기 확정한다. 집행 지연 가능성이 있는 항목은 사전 점검하여 대체 집행계획을 마련하고, 이월 예산은 성과창출 가능성이 높은 산학프로젝트, 인턴십, 융합교육 개선에 우선 활용한다.\n     \n7. 성과지표 관리 및 증빙체계 보완 필요\n성과지표별 담당부서, 산출식, 증빙자료, 점검주기를 명확히 설정한다. 자체평가위원회를 중심으로 월별 또는 분기별 성과관리 대시보드를 운영하고, 목표 미달 지표는 즉시 개선계획을 수립하는 MBO 기반 환류체계를 강화한다."},{"projectName":"(국고)SW중심대학 운영(소프트웨어중심대학사업단)","weakness":"1. 산업체 경력 교원 확보 미흡\n산업체 경력 교원 비율은 목표 20% 대비 실적 12%로 목표를 달성하지 못하였다. 산학협력 교육과 실무형 프로젝트를 확대하기 위해서는 산업체 경험을 보유한 교원의 확보가 필요하다.\n     \n2. 인턴십 운영 규모 부족\n산학프로젝트는 활발히 운영되었으나 인턴십 참여자는 SU-인턴십 2명, ICT학점연계 인턴십 2명으로 규모가 크지 않다. 사업계획서상 제시된 다양한 인턴십 모델이 충분히 확대되지 못한 점이 취약요소이다.\n     \n3. 자유전공학부 신설에 따른 SW전공 유입 불확실성\n자유전공학부 신설로 SW관련학과 입학정원이 기존보다 축소되었으며, 자유전공 학생의 전공 선택 결과에 따라 SW전공 학생 수급에 변동 가능성이 있다.\n     \n4. SW융합교육 만족도 개선 필요\nSW융합교육의 추천 의향은 높으나 교육만족도는 76.3% 수준으로 나타나 개선 여지가 있다. 비SW전공 학생의 경우 프로그래밍 기초역량 차이, 교과 난이도, 시간표 부담 등이 학습 지속성에 영향을 줄 수 있다.\n     \n5. 산학프로젝트 질 관리체계 고도화 필요\n산학프로젝트 수는 확대되었으나 프로젝트별 성과 수준, 산업체 활용도, 사업화 가능성에 대한 체계적 질 관리가 추가로 필요하다.\n     \n6. 예산 집행률 및 이월금 관리 필요\n2025년 예산 집행률은 89.86%로, 일부 예산이 이월되었다. 프로그램 운영 시기 지연, 인력 채용 및 사업 일정 조정 등이 예산 집행에 영향을 미친 것으로 보인다.\n     \n7. 성과지표 관리 및 증빙체계 보완 필요\n일부 성과지표에서 산식, 목표값, 증빙자료 관리가 명확하지 않은 부분이 있다. 특히 인턴십, 신기술 교과목, SW정원 비율 등은 지속적인 기준 관리가 필요하다.","improve 로그램 안내 및 운영 동선 개선이 필요한 것으로 확인되었다.\n\n차년도 계획은\n「Challenge Project」\n- 운영 일정 개선 및 참여자 간 교류시간 확대\n- 사전·사후 조사 기반 성과관리 체계 고도화\n- 참여자 특성을 고려한 맞춤형 프로그램 운영 및 안전관리 체계 강화\n「HOPE CAMP」\n- 운영시간 조정을 통한 참여자 귀가 편의성 제고\n- 기상 악화 대응 운영계획 마련 및 운영환경 개선을 통해 프로그램의 운영 품질과 참여 만족도를 지속적으로 향상\n\n[MVP교육 프로그램 운영_MVP+교육, MVP CAMP 성과관리계획]\n2025년 리더십센터 [MVP교육 프로그램 운영]은 MVP+교육과 MVP CAMP(공동체리더교육 포함) 2개 세부 프로그램을 운영하여 재학생의 리더십 역량 강화와 신입생의 대학생활 적응 및 공동체 형성을 지원하였다.\n총 참여인원은 1,223명(MVP+교육 211명, MVP CAMP 공동체리더교육 99명·2026학년도 신입생 913명)이며, MVP+교육은 만족도 목표 4.5점 대비 4.48점, MVP CAMP는 만족도 목표 4.4점 대비 4.55점을 기록하는 등 교육 프로그램의 효과성과 참여 만족도를 제고하였다.\n\n예산집행률은 100%, 사업이행률은 97.7%를 달성하였다.\nMVP+교육은 참여인원 목표(200명) 대비 211명이 참여하여 목표를 초과 달성하였으나, 만족도는 목표(4.5점) 대비 4.48점으로 소폭 미달하였다.\n사업환류 결과, 졸업요건 충족 중심의 참여로 자발적 참여 동기가 다소 부족하였으며, 온라인 교육 콘텐츠의 품질과 최신성, 학년별 특성을 반영한 맞춤형 콘텐츠 구성이 주요 개선과제로 도출되었다.\nMVP CAMP는 공동체리더교육 참여인원 목표(100명) 대비 99명, 신입생 참여인원 목표(1,000명) 대비 913명이 참여하여 일부 성과지표는 목표에 미달하였으나, 만족도는 목표(4.4점) 대비 4.55점을 기록하여 목표를 초과 달성하였다.\n사업환류 결과, 정시모집 일정과 프로그램 운영시기 간 불일치에 따른 참여율 제약, 공동체리더교육 및 캠프 일정의 높은 운영 밀도로 인한 참여자 피로도 증가, 생활관·식당 등 유관부서 간 운영기준 차이와 시설 수용 한계 등이 주요 개선과제로 확인되었다.\n\n차년도 계획은\n「MVP+교육」\n- 참여형·실습형 콘텐츠 확대 및 학년별 맞춤형 교육과정 운영\n- 온라인 콘텐츠 품질 개선 및 최신 리더십 사례 반영\n「MVP CAMP」\n- 정시모집 일정과 연계한 탄력적 참여자 모집 및 운영체계 구축\n- 생활관·식당·입학처 등 유관부서와의 사전 협의를 통한 통합 운영체계 강화\n- 프로그램 운영 일정 조정 및 역할 분산을 통한 참여자 부담 완화를 추진하여 사업성과와 교육 효과성을 지속적으로 제고","performancePlan2026Source":"ir_comment","performancePlan2026Meta":{"raw":"[리더십역량 개발 프로그램 운영_Challenge Project · HOPE CAMP 성과관리계획]\n2025년 리더십센터 [리더십역량 개발 프로그램 운영]은 Challenge Project와 HOPE CAMP 2개 세부 프로그램을 운영하여 재학생의 도전정신, 협업 역량 및 공동체 의식 함양을 지원하였다.\n총 참여인원은 372명(Challenge Project 114명, HOPE CAMP 258명)이며, Challenge Project는 만족도 목표 4.5점 대비 4.67점, HOPE CAMP는 만족도 목표 4.7점 대비 4.9점을 달성하는 등 학생 참여 확대와 교육 만족도 제고에 기여하였다.\n\n예산집행률은 84.62%, 사업이행률은 101.8%를 달성하였다.\nChallenge Project는 참여인원 목표(120명) 대비 114명이 참여하여 목표 대비 95%를 달성하였으며, 만족도는 목표를 초과달성하였다. HOPE CAMP는 참여인원 목표(200명) 대비 258명이 참여하고 만족도 또한 목표를 초과 달성하는 등 성과지표를 전반적으로 달성하였다.\n사업환류 결과, Challeng 000}],"feedback":[{"projectName":"(혁신2)리더십역량 개발 프로그램 운영(인성교육원)","weakness":"[Challenge Project]\n1. 성과 목표 일부 미달 발생: 재학생 참여 목표 대비 실적이 소폭 미달(120명 목표→114명 참여)하여 모집 및 일정 운영의 유연성 확보 필요\n2. 일정 운영의 구조적 한계: 단기간 집중형 프로그램으로 일정이 촘촘하게 구성되어 참여자 간 충분한 교류 및 관계 형성 시간이 부족함\n3. 성과관리 체계의 한계: 사후 설문 참여율 저조 및 사전·사후 비교 데이터 부족으로 교육 효과 및 성장 변화에 대한 체계적 분석이 미흡함\n4. 참여자 특성 교려 부족: 체력 및 수행 역량 차이를 충분히 반영하지 못해 일부 참여자의 활동 부담 및 프로그램 몰입도 저하 발생\n5. 안전관리 및 운영 대응체계 보완 필요: 참여 인원 증가에 따라 현장 안전관리 및 운영 인력 배치 등 관리 체계의 추가 보완 필요\n[HOPE CAMP]\n1. 운영 방식 변경에 따른 문제: 숙박 프로그램에서 당일 프로그램으로 변경 됨으로 프로그램 종료시간이 늦어져 학생들의 귀가 어려움이 발생됨\n2. 기상 상황에 따른 제약: 야외 캠프장에서 진행되므로 우천이나 강풍시 프로그램 진행에 차질이 발생함\n3. 해충 및 모기 피해: 야외 및 야간에 진행되어 참가자들이 모기에 노출되는 등 불편함 발생","improvement":"[Challenge Project]\n1, 일정 운영 구조 개선: 프로그램 내 중간 휴식 및 교류 시간을 확대하여 참여자 간 관계 형성과 몰입도 향상, 과도한 일정 밀도를 완화한 균형형 프로그램으로 개편\n2. 성과관리 체계 구축 및 고도화: 사전·사후 조사 체계를 도입하고 현장 즉시 설문 시스템을 운영하여 참여 효과 및 역량 변화에 대한 정량·정성 분석 기반 마련\n3. 프로그램 운영 방식 및 구조 개선: 팀 단위 활동과 더불어 전체 참여자 교류 프로그램을 확대하고, 프로그램 간 연계성을 강화하여 지속가능한 리더십 교육 체계로 발전\n4. 참여자 맞춤형 운영 방식 도입: 체력 및 역량 수준을 고려한 그룹 편성 및 난이도 조절을 통해 참여 부담을 완화하고 프로그램 참여 만족도 제고\n[HOPE CAMP]\n1. 운영시간 확대 및 유연화: 프로그램의 시작 시간을 앞당기거나 프로그램 구성을 조정하여 프로그램 종료시간을 앞당기기\n2. 환경에 따른 대책 마련: 프로그램의 횟수의 여유 날짜를 확보하여 취소 되더라도 다른 날짜에 운영될 수 있도록 계획\n3.방충 장비 및 방역 확대: 개인별 퇴치 손목 밴드 지급 및 캠핑장 주변에 프로그램 시작 전 집중 방역 실시"},{"projectName":"MVP교육 프로그램 운영(인성교육원)","weakness":"[MVP+교육]\n1. 학생들의 자발성이 낮고 참여도 저조: 대부분의 참여 학생이 졸업 필수 요건을 충족하기 위해 참여하는 학생들로 교육 참여의 자발성 참여도 저조\n2. 영상 제적 품질 미흡: 온라인 영상의 음질, 화질, 자막 등 개선 필요\n3. 콘텐츠의 진부함: 교육의 내용이 너무 보편적이고 흔한 주제로 수강 학생들에게 새로운 인사이트를 주기에 부족\n4. 학년별 교육 차별화 부족: 주로 고학년(3,4학년)이 이수하는 프로그램임에도 불구하고, 영상의 난이도 및 사례가 신입생 위주 구성으로 인해 대상자의 학업 수준에 적합하지 못하다는 평가 발생\n[MVP CAMP(공동체리더교육)]\n1. 성과 목표 대비 일부 미달 발생\n- 신입생 참여 목표(1,000명) 대비 실적(913명)으로 목표 달성에 일부 미달 발생\n- 정시 합격자 발표 및 추가등록 일정과 프로그램 운영 시기의 불일ㅇ치로 인해 참여율 확보에 구조적 한계 발생\n2. 프로그램 운영 밀도 과다에 따른 참여자 피로도 증가\n- 공동체리더교육(2주) 및 MVP CAMP(2박3일씩 2회) 모두 일정이 밀도 높게 구성되어 참여자의 체감 부담 발생\n- 특히 리더(운영진)의 경우 퍼포먼스 준비 및 프로그램 운영이 병행되며 과중한 역할 부담 발생→교육 효과 저하 및 참여 만족도 저해 가능성 존재\n3. 운영 지원 시스템의 분산 및 표준화 미흡\n- 식당 운영, 생활관 관리 등 유관 부서 간 운영 기준이 상이하여 서비스 품질 편차 발생\n- 특히 식단 구성, 시설 이용 환경, 배식 운영 등에서 일관성 부족 확인→대규모 프로그램 운영에 필요한 통합 관리 체계 미흡\n4. 시설 및 환경 인프라의 수용 한계\n- 생활관 시설 이용 과정에서 청결 상태 및 샤워시설 부족 등 환경적 불편 발생\n- 참여 인원 대비 인프라 수용력이 제한되어 프로그램 운영 만족도 저해 요인으로 작용\n5. 인력 운영 및 근무 여견의 구조적 한계\n- 장기간 프로그램 운영 및 야간 운영으로 인해 담당 직원의 근무 부담 증가\n- 대규모 프로그램 대비 인력 및 보상 체계가 충분히 제도화되지 않아 지속가능한 운영에 한계 존재","improvement":"[MVP+교육]\n1, 강의 방식 개선: 단순 강의가 아닌 팀별 미션, 리더십 시뮬레이션 등 활동 중심 컨텐츠 강화\n2. 교육의 최신 트렌드 및 맞춤형 강의 제공: 사회적 변화를 반영한 주제를 도입 및 수준별 난이도를 조절하여 강의 분리 운영\n[MVP CAMP(공동체리더교육)]\n1. 정시 일정에 대응한 추가접수 및 탄력적 인원 운영 체계를 구축하여 참여 기회를 확대하고 참여율을 제고\n2. 부서 간 협업 기반 통합 운영 강화\n- 생활관, 식당, 입학처 등 관련 행정부서와의 사전 협의를 통해 일정 및 운영 기준 사전 조율\n- 입시 일정-프로그램 운영-시설 이용을 연계한 통합 운영 체계 구축→프로그램 운영 안정성 및 효율성 확보"}],"submission":{"status":"submitted","files":[{"name":"교목처 리더십센터-55.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EA%B5%90%EB%AA%A9%EC%B2%98%20%EB%A6%AC%EB%8D%94%EC%8B%AD%EC%84%BC%ED%84%B0-55.pdf","hasPdf":true,"gwSource":"통합문서함","worklistid":"890197"}],"contact":{"name":"황수민","email":"8603sm@syu.ac.kr"},"annualReport2025PdfHref":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EA%B5%90%EB%AA%A9%EC%B2%98%20%EB%A6%AC%EB%8D%94%EC%8B%AD%EC%84%BC%ED%84%B0-55.pdf","remarks":[],"hasAnomaly":false},"annualReport2024PdfHref":"annual_reports/2024/인성교육원.pdf","annualReport2025IrPdfHref":"annual_reports/2025/인성교육원.pdf","annualReport2025PdfHref":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EA%B5%90%EB%AA%A9%EC%B2%98%20%EB%A6%AC%EB%8D%94%EC%8B%AD%EC%84%BC%ED%84%B0-55.pdf","annualReport2025PdfSource":"gw","budgetHistory":{"2023":336800000,"2024":79099000,"2025":341000 ▲ 예산집행률 : A+ (99.93%) ▲ 사업이행률 : A+ (153.75%) ▲ 종합점수 : A+2. 주요성과 및 개선과제\n2025년 창업교육센터는 실전창업프로그램, 창업크리에이터 양성 프로그램, 창업오디션 프로그램, 공유 교육과정 개발·운영, 창업동아리\n지원, 창업지원단 운영 등 주요 사업을 추진하였으며, 전\n사업에서 예산 집행률 98~100%를 달성하고 계획된 사업을 차질 없이 수행함. 특히 성과관리 사업의 이행률은 실전창업프로그램\n156%, 창업크리에이터 양성 프로그램 219%, 창업오디션 프로그램 140%, 공유 교육과정 개발·운영\n100% 등으로 전 사업이 목표를 달성 또는 초과 달성하며 학생 창업역량 강화 및 창업 저변 확대 체계를 강화하였음. 사업 운영 결과, 대부분의 사업은 목표를\n초과 달성하였으나 일부 프로그램에서는 학생들의 창업에 대한 인식 부족으로 인한 참여자 모집의 어려움, 메이커\n교육과 실제 창업 간 연계 부족, 선발 후 노쇼 발생에 따른 운영 변수, 수요 대비 제한된 참여 인원, 창업 프로그램 운영 예산 확보의 한계 등이 개선과제로 도출됨. 이에 따라 창업인식 개선을 위한 홍보 강화, 사업화\n중심 운영을 통한 실전감각 및 창업역량 제고, 국고사업 수주를 통한 예산 확보, 노쇼 방지를 위한 참여 관리체계 정비 등의 필요성이 확인됨.3. 차년도 운영계획\n차년도에는 사업 환류 결과를 반영하여 ▲ 창업인식\n개선 캠페인 및 홍보 강화를 통한 참여 저변 확대 ▲ 사업화 중심의 실전창업 지원 고도화를 통한 창업성과\n제고 ▲ 차별화된 메이커 교육과 창직연계 프로그램 체계화 ▲ 노쇼 방지를 위한 선발·참여 관리체계 정비  ▲ 국고 창업지원사업 수주를\n통한 안정적 재원 확보 ▲ 창업동아리-창업오디션-실전창업으로 이어지는 단계별 연계체계 구축 ▲ 정기적인 성과 모니터링과\n환류 운영을 통해 사업 운영의 질을 지속적으로 개선할 계획. 이를 통해 창업 교육-발굴-사업화를 아우르는 통합 창업지원체계를 더욱 강화하고, 창업성과와 참여자\n만족도를 동시에 향상시키는 지속가능한 성과관리 체계를 구축하고자 함.","performancePlan2026Source":"ir_comment","performancePlan2026Meta":{"raw":"1. 사업운영현황\n창업교육센터는 2025학년도에 총 6개 사업을 운영하였으며, 이 중 성과관리 사업은 4개, 항례적 사업은 2개로\n구성됨. 전체 사업 운영결과, 다음과 같은 평가를\n받음.\n▲ 예산집행률 : A+ (99.93%) ▲ 사업이행률 : A+ (153.75%) ▲ 종합점수 : A+2. 주요성과 및 개선과제\n2025년 창업교육센터는 실전창업프로그램, 창업크리에이터 양성 프로그램, 창업오디션 프로그램, 공유 교육과정 개발·운영, 창업동아리\n지원, 창업지원단 운영 등 주요 사업을 추진하였으며, 전\n사업에서 예산 집행률 98~100%를 달성하고 계획된 사업을 차질 없이 수행함. 특히 성과관리 사업의 이행률은 실전창업프로그램\n156%, 창업크리에이터 양성 프로그램 219%, 창업오디션 프로그램 140%, 공유 교육과정 개발·운영\n100% 등으로 전 사업이 목표를 달성 또는 초과 달성하며 학생 창업역량 강화 및 창업 저변 확대 체계를 강화하였음. 사업 운영 결과, 대부분의 사업은 목표를\n초과 달성하였으나 일부 프로그램에서는 학생들의 창업에 대한 인식 부족으로 인한 참여자 모집의 어려움, 메이커\n교육과 실제 창업 간 연계 부족, 선발 후 노쇼 발생에 따른 운영 변수, 수요 대비 제한된 참여 인원, 창업 프로그램 운영 예산 확보의 한계 등이 개선과제로 도출됨. 이에 따라 창업인식 개선을 위한 홍보 강화, 사업화\n중심 운영을 통한 실전감각 및 창업역량 제고, 국고사업 수주를 통한 예산 확보, 노쇼 방지를 위한 참여 관리체계 정비 등의 필요성이 확인됨.3. 차년도 운영계획\n차년도에는 사업 환류 결과를 반영하여 ▲ 창업인식\n개선 캠페인 및 홍보 강화를 통한 참여 저변 확대 ▲ 사업화 중심의 실전창업 지원 고도화를 통한 창업성과\n제고 ▲ 차별화 5599000,"2026":69770000},"budgetChangeRate":-74.3,"performance2026":{"adjustedBudget":69770000},"summary2026":{"totalBudget":69770000,"fundedProjectCount":1,"source":"perfGrid"},"performancePlan2026HtmlPath":"html/최고경영자과정/performance_plan2026.html"},{"name":"취업진로지원센터","evaluation":{"totalScore":"A+","budgetExecRate":"A+","projectExecRate":"A+","performancePlan2026":"1. 사업운영현황\n취업진로지원센터는 2025학년도에 총 22개 사업을 운영하였으며, 이 중 성과관리 사업은16개, 항례적 사업은 6개로 구성됨. 전체 사업 운영결과, 다음과 같은 평가를 받음.\n▲예산집행률: A+ ▲사업이행률: A+ ▲종합점수: A+\n\n2. 2025년 취업진로지원센터는 대학일자리플러스센터, 재학생 맞춤형 고용서비스, 졸업생 특화프로그램, 취업동아리 운영, 영어능력향상 프로그램, 파란사다리, 포천시 경기청년사다리, 한일 대학생 연수사업 등 주요 사업을 추진하였으며, 대부분의 사업에서 예산 집행률 95~100%를 달성하고 계획된 사업을 차질 없이 수행 함. 또한 진로·취업 상담 7,275건(목표 대비 157.3%), 진로·취업 비교과 프로그램 참여자 12,897명(104.9%), 취업동아리 26개(130%), 참여자 246명(129.5%), 졸업생 특화프로그램 참여자 428명(107%) 등 주요 성과지표를 초과 달성하며 학생 및 졸업생 대상 맞춤형 취업지원 체계를 강화하였음. 사업 운영 결과, 대부분의 사업은 목표를 초과 달성하였으나 일부 프로그램에서는 참여자 모집의 어려움, 프로그램 간 연계 부족, 졸업생 DB 최신화 미흡, 학과 특성을 반영한 맞춤형 운영 부족, 온라인 시스템 활용 및 사후관리 체계 미흡 등이 개선과제로 도출됨. 또한 해외연수 사업에서는 사전교육 중복, 참가자 건강관리, 숙소 및 항공권 확보, 생활비 부담 등 운영상의 개선 필요성이 확인되었으며, 재학생 맞춤형 고용서비스에서는 잡케어 이후 포트폴리오 및 IAP 수립으로 연계되는 학생 관리 강화가 요구됨.\n\n3. 차년도 운영계획\n 차년도에는 사업 환류 결과를 반영하여 ▲학생·졸업생 대상 맞춤형 상담 및 취업지원 고도화 ▲학과 및 산업체 연계 프로그램 확대를 통한 취업성과 제고 ▲성과 중심의 프로그램 운영 및 단계별 연계체계 구축 ▲졸업생 DB 관리와 사후관리 체계 강화 ▲잡케어 기반 진로설계 및 취업지원 연계 확대▲온라인 플랫폼과 데이터 기반 성과관리 체계 고도화 ▲정기적인 성과 모니터링과 환류 운영을 통해 사업 운영의 질을 지속적으로 개선할 계획, 이를 통해 학생·졸업생·지역청년을 아우르는 통합 취업지원체계를 더욱 강화하고, 취업성과와 이용자 만족도를 동시에 향상시키는 지속가능한 성과관리 체계를 구축하고자 함.","performancePlan2026Source":"ir_comment","performancePlan2026Meta":{"raw":"1. 사업운영현황\n취업진로지원센터는 2025학년도에 총 22개 사업을 운영하였으며, 이 중 성과관리 사업은16개, 항례적 사업은 6개로 구성됨. 전체 사업 운영결과, 다음과 같은 평가를 받음.\n▲예산집행률: A+ ▲사업이행률: A+ ▲종합점수: A+\n\n2. 2025년 취업진로지원센터는 대학일자리플러스센터, 재학생 맞춤형 고용서비스, 졸업생 특화프로그램, 취업동아리 운영, 영어능력향상 프로그램, 파란사다리, 포천시 경기청년사다리, 한일 대학생 연수사업 등 주요 사업을 추진하였으며, 대부분의 사업에서 예산 집행률 95~100%를 달성하고 계획된 사업을 차질 없이 수행 함. 또한 진로·취업 상담 7,275건(목표 대비 157.3%), 진로·취업 비교과 프로그램 참여자 12,897명(104.9%), 취업동아리 26개(130%), 참여 업 특성상 예산집행률을 성과지표로 관리하며, 예산집행률 100%를 달성하여 계획된 사업을 차질 없이 수행하였다.\n사업환류 결과, 캡스톤디자인 운영은 수강 전·후 설문조사의 체계화, 만족도 조사 문항 개선, 성과분석 결과의 차년도 교과 운영 반영 및 멘토링 활성화가 핵심 개선과제로 도출되었다. 우편발송/SMS 사용 사업은 반송우편 발생의 주요 원인이 수신자 주소 및 연락처 오류로 분석되어, 발송 전 정보 확인 절차와 개인정보 최신화 안내를 강화할 필요가 있는 것으로 확인되었다.\n\n항례적사업인 「우편발송/SMS 사용」은 반복적·정형화된 행정지원 업무의 성격이 강하여 별도의 성과관리사업으로 운영할 필요성은 낮은 것으로 판단된다. \n다만 우편 반송률, 발송 정확성, 예산 집행 효율성 등 기본 운영지표는 지속적으로 점검하여 행정서비스의 품질을 유지하고 업무 효율성을 제고할 필요가 있다.\n\n차년도에는 ▲캡스톤디자인 성과분석 및 만족도 조사 체계 고도화 ▲성과분석 결과의 교육과정 환류 강화 ▲멘토링 운영 활성화를 통한 학생 참여 확대 ▲우편발송 전 주소·연락처 사전 검증 절차 마련 ▲학생 개인정보 현행화 안내 강화 등을 추진하여 사업성과와 행정서비스의 품질을 지속적으로 향상시킬 계획이다.","performancePlan2026Source":"ir_comment","performancePlan2026Meta":{"raw":"2025년 학사지원팀은 총 2개 사업(성과관리사업 1개, 항례적사업 1개)을 운영하였다. \n성과관리사업인 「캡스톤디자인 운영」은 학생의 전공역량 및 문제해결역량 강화를 목표로 추진하였으며, 항례적사업인 「우편발송/SMS 사용」은 학사행정의 안정적인 정보 전달을 지원하기 위해 운영하였다. \n\n예산집행률은 각각 71.59%, 100%를 기록하여 계획된 예산을 적정하게 집행하였다.\n\n다만 성과관리사업인 캡스톤디자인 운영은 사업이행률이 23.6%로 성과목표 달성에 다소 미흡한 결과를 보였다. 항례적사업은 사업 특성상 예산집행률을 성과지표로 관리하며, 예산집행률 100%를 달성하여 계획된 사업을 차질 없이 수행하였다.\n사업환류 결과, 캡스톤디자인 운영은 수강 전·후 설문조사의 체계화, 만족도 조사 문항 개선, 성과분석 결과의 차년도 교과 운영 반영 및 멘토링 활성화가 핵심 개선과제로 도출되었다. 우편발송/SMS 사용 사업은 반송우편 발생의 주요 원인이 수신자 주소 및 연락처 오류로 분석되어, 발송 전 정보 확인 절차와 개인정보 최신화 안내를 강화할 필요가 있는 것으로 확인되었다.\n\n항례적사업인 「우편발송/SMS 사용」은 반복적·정형화된 행정지원 업무의 성격이 강하여 별도의 성과관리사업으로 운영할 필요성은 낮은 것으로 판단된다. \n다만 우편 반송률, 발송 정확성, 예산 집행 효율성 등 기본 운영지표는 지속적으로 점검하여 행정서비스의 품질을 유지하고 업무 효율성을 제고할 필요가 있다.\n\n차년도에는 ▲캡스톤디자인 성과분석 및 만족도 조사 체계 고도화 ▲성과분석 결과의 교육과정 환류 강화 ▲멘토링 운영 활성화를 통한 학생 참여 확대 ▲우편발송 전 주소·연락처 사전 검증 절차 마련 ▲학생 개인정보 현행화 안내 강화 등을 추진하여 사업성과와 행정서비스의 품질을 지속적으로 향상시킬 계획이다.","hasContent":true,"isSubstantive":true,"source":"ir_comment"}},"performance":{"category":"학사지원팀","budgetExecRate":76.18,"projectExecRate":23.6,"adjustedBudget":47707000},"summary":{"projectCount":19,"byType":{"성과관리사업":1,"항례적사업":14,"지정안됨":4},"avgProjectExecRate":null},"projects":[{"name":"(혁신2)ICT 역량강화 교육환경 구축 및 운영(학사지원팀)","mgmtType":"항례적사업","budget":null,"budgetExecRate":null,"budgetExecApplied":fal /%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%EA%B5%90%EB%AC%B4%EC%B2%98%20%ED%95%99%EC%82%AC%EC%A7%80%EC%9B%90%ED%8C%80-520.pdf","annualReport2025PdfSource":"gw","budgetHistory":{"2023":73500000,"2024":61970000,"2025":47707000,"2026":58500000},"budgetChangeRate":-23.0,"performance2026":{"adjustedBudget":58500000},"summary2026":{"totalBudget":58500000,"fundedProjectCount":13,"source":"perfGrid"},"performancePlan2026HtmlPath":"html/학사지원팀/performance_plan2026.html"},{"name":"학생복지팀","evaluation":{"totalScore":"A","budgetExecRate":"A+","projectExecRate":"A","performancePlan2026":"학생복지팀 부서연차평가 성과관리계획(안)\n\n1. 추진목표\n학생복지팀은 장학·복지·학생자치 지원을 유기적으로 연계한 학생성공(Student Success) 중심의 통합 복지체계를 구축하여 학생 만족도와 교육성과를 향상시키고자 한다.\n2025년 연차보고서 결과 예산집행률 95.48%(A+), 사업이행률 99.94%(A), 종합점수(A)를 달성한 성과를 바탕으로, 2026년에는 성과관리 체계를 더욱 고도화하여 학생 체감형 복지서비스 확대, 데이터 기반 행정, 사업성과의 정량적 관리를 통해 지속적인 성과 향상을 추진한다.\n2. 성과 관리 추진 방향\n가. 학생 중심 장학 행정 구현\n- 국가 장학금 및 교내·외 장학금 적기 지급\n- 장학제도 홍보 강화 및 학생 접근성 향상\n- 장학 행정 시스템 고도화\n- 장학 데이터 분석을 통한 정책 개선\n나. 학생 체감형 복지서비스 확대\n- 천원의 아침밥 및 저녁밥 확대\n- 천보축전·사랑나눔축제 등 학생 참여형 행사 고도화\n- 외국인 및 취약 계층 맞춤형 복지 지원\n- 학생 참여 및 의견을 반영한 복지사업 개선\n다. 학생 자치 활성화\n- 총학생회 및 학생자치기구 역량 강화\n- 학생 자치 프로그램 확대\n- 학생 언론 활성화 지원\n- 리더십 교육 강화\n라. 데이터 기반 성과관리\n- 분기별 사업성과 분석\n- KPI 실적관리\n- 예산 집행 상시 모니터링\n- 성과분석 결과 차년도 사업 반영\n3. 중점 개선 과제\n가. 예산집행 관리\n- 전체 사업을 중점관리하야 집행이 부진한 사업을 사전에 상시 점검하고 분기별 모니터링을 실시하여 예산 집행률 95% 이상을 달성한다.\n나. 사업 성과 관리\n- 사업별 KPI와 성과지표를 운영하여 사업 이행률 95% 이상을 달성한다.\n다. 학생 만족도 향상\n- 학생 의견을 적극 수렴하고 만족도 조사 및 점검을 실시하여 만족도 90점 이상을 유지한다.\n라. 업무 효율화\n- 장학 및 복지 업무의 전산화와 데이터 관리 강화를 통해 업무처리 기간을 단축한다.\n4. 핵심성과지표(KPI)\n- 예산 집행률 95% 이상\n- 사업 이행률 95% 이상\n- 학생 만족도 90점 이상\n- 장학금 지급 적기 처리율 100%\n- 학생 자치 프로그램 참여율 전년 대비 10% 향상\n- 복지 프로그램 참여 학생 수 전년 대비 10% 증가\n5. 기대효과\n학생복지팀은 학생성공(Student Success)을 중심으로 장학, 복지, 학생자치를 유기적으로 연계하여 학생 중심의 복지서비스를 강화하고, 데이터 기반의 성과관리 체계를 구축함으로써 사업의 효율성과 학생 만족도를 지속적으로 향상시키고자 한다. 또한 성과관리의 선순환 체계를 정착시켜 예산 운영의 효율성을 높이고, 학생지원 경쟁력을 강화하여 연차평가 A+등급 이상을 지속적으로 유지하는 것을 목표로 한다.","performancePlan20 소.\n나. 교직원 대상 심리지원 프로그램이 타부서와 일부 중복되며, 직원들의 중복 참여가 다수 있어 프로그램 운영 조정이 필요함.","improvement":"가. ﻿또래 상담사 양성과정을 향후에는 연간교육 일정을 정례화하여 사전에 충분히 계획하고, 스케줄 충돌을 사전에 방지함으로써 교육이 계획대로 운용되도록 관리체계를 강화하고자 함.\n나.  타부서의 유사 사업 운영과의 중﻿복을 고려하여 학생상담센터에서는 별도로 추진 하지 않으려 함."},{"projectName":"대학생활 적응 수준별 상담관리체계 구축(심리검사비)(학생상담센터)","weakness":"가. 심리검사는 기관별, 검사별로 구매해야 하고 최소 구매 수량이 정해져 있어 실제 수요에 탄력적으로 대응하는데 한계가 있음. \n나. 여분 재고가 없어 추가 수요 발생시 즉각적인 지원이 어려움.","improvement":"가. 2026년 예산 증액으로 심리검사 운영에 필요한 예산 확보\n나. 현행 유지"}],"submission":{"status":"submitted","files":[{"name":"학생처 학생상담센터-68.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%ED%95%99%EC%83%9D%EC%B2%98%20%ED%95%99%EC%83%9D%EC%83%81%EB%8B%B4%EC%84%BC%ED%84%B0-68.pdf","hasPdf":true,"gwSource":"통합문서함","worklistid":"890196"},{"name":"학생처 학생상담센터-87.pdf","href":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%ED%95%99%EC%83%9D%EC%B2%98%20%ED%95%99%EC%83%9D%EC%83%81%EB%8B%B4%EC%84%BC%ED%84%B0-87.pdf","hasPdf":true,"gwSource":"통합문서함","worklistid":"791865"}],"contact":{"name":"","email":""},"annualReport2025PdfHref":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%ED%95%99%EC%83%9D%EC%B2%98%20%ED%95%99%EC%83%9D%EC%83%81%EB%8B%B4%EC%84%BC%ED%84%B0-68.pdf","remarks":[],"hasAnomaly":false},"annualReport2024PdfHref":"annual_reports/2024/학생상담센터.pdf","annualReport2025IrPdfHref":"annual_reports/2025/학생상담센터.pdf","annualReport2025PdfHref":"file:///F:/%EA%B8%B0%ED%9A%8D%ED%8F%89%EA%B0%80/2026/2025%EC%97%B0%EC%B0%A8%EB%B3%B4%EA%B3%A0%EC%84%9C/%EB%B6%80%EC%84%9C%EA%B3%B5%EB%AC%B8%EC%A0%9C%EC%B6%9C/%ED%95%99%EC%83%9D%EC%B2%98%20%ED%95%99%EC%83%9D%EC%83%81%EB%8B%B4%EC%84%BC%ED%84%B0-68.pdf","annualReport2025PdfSource":"gw","bu
