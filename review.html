<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025학년도 연차평가 서면심의</title>
  <link rel="stylesheet" href="assets/review.css">
</head>
<body>
  <header class="bar">
    <div class="bar-copy">
      <p class="kicker">삼육대학교 기획처</p>
      <h1>2025학년도 연차평가 서면심의</h1>
    </div>
    <div class="bar-actions">
      <label class="jump">
        <span>보고서로 이동</span>
        <select id="jumpSelect">
          <option value="#vol-midterm">중장기발전계획 연차평가</option>
          <option value="#vol-dept">부서별 연차평가</option>
        </select>
      </label>
      <a class="bar-link ghost" href="index.html">처음으로</a>
      <button type="button" class="bar-link form-toggle" id="formToggle">의견 작성</button>
    </div>
  </header>

  <div class="split">
    <section class="report-pane" aria-label="연차평가 보고서">
      <iframe
        id="reportFrame"
        title="2025학년도 연차평가 보고서"
        src="reports/2025학년도_연차평가_보고서.html"
      ></iframe>
    </section>

    <aside class="form-pane" id="formPane" aria-label="서면의견">
      <section id="gateBox">
        <p class="form-lead">위원 성명을 입력하고 들어가십시오. 다른 위원의 내용은 보이지 않습니다.</p>
        <label>
          <span>위원 성명</span>
          <input type="text" id="gateName" autocomplete="name">
        </label>
        <p class="form-status" id="gateStatus" role="status"></p>
        <button type="button" id="enterBtn" class="primary-btn">들어가기</button>
        <p class="form-note" id="gateNote">같은 이름으로 다시 들어가면 임시저장·제출 내용이 열립니다. 평가기간까지는 제출 후에도 수정할 수 있습니다.</p>
      </section>

      <form id="reviewForm" class="hidden" novalidate>
        <div class="who-bar">
          <p>작성 중: <strong id="whoName"></strong></p>
          <button type="button" id="switchBtn">다른 위원</button>
        </div>
        <p class="form-lead">왼쪽 보고서를 보면서 작성하십시오.</p>

        <label>
          <span>잘된 점</span>
          <textarea name="good" id="fieldGood" required></textarea>
        </label>
        <label>
          <span>미흡하거나 보완할 점</span>
          <textarea name="weak" id="fieldWeak" required></textarea>
        </label>
        <label>
          <span>제도·산식·환류에 대한 제안</span>
          <textarea name="suggest" id="fieldSuggest" required></textarea>
        </label>

        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <p class="form-status" id="formStatus" role="status"></p>
        <div class="btn-row">
          <button type="button" id="saveBtn">임시저장</button>
          <button type="button" id="editBtn">수정</button>
          <button type="submit" id="submitBtn">제출</button>
        </div>
        <p class="form-note" id="formNote">제출하면 기획처 메일로 전달됩니다. 평가기간까지는 다시 들어와 수정한 뒤 다시 제출할 수 있습니다.</p>
      </form>

      <section id="byeBox" class="hidden">
        <h2>평가기간이 종료되었습니다</h2>
        <p id="byeText">더 이상 작성하거나 수정할 수 없습니다.</p>
        <button type="button" id="byeSwitch" class="primary-btn">다른 위원으로</button>
      </section>
    </aside>
  </div>

  <script src="assets/review.js"></script>
</body>
</html>
