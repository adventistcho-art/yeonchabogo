<h1>금연금주클리닉 · 성과관리계획(2026년 반영)</h1>
<p>2025년 금연금주클리닉은 항례적 사업 1개를 운영하여 예산집행률 99.95% 달성함.</p><p>사업환류 결과, 니코틴 검사 외 검사 신뢰도를 높일 수 있는 검사방법과, 금연 유지 지원 체계 구축이 주요 개선과제로 도출됨.</p><p>차년도 계획으로는 보건소와 연계한 금연 관련 검사 확대, 학생상담센터와 연계한 상담 및 사후관리 체계 구축, 체험형 금연 교육 프로그램 운영을 추진하여 금연 지원의 전문성과 지속성을 강화하고자 함.</p>
